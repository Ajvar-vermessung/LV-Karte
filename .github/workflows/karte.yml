# Baut jede Woche die Offline-Karte Deutschland aus dem neuesten
# Protomaps-Stand (OpenStreetMap) und stellt sie als Release bereit.
#
# Ablauf:
#   1. neuesten Tagesstand von build.protomaps.com bestimmen
#   2. Deutschland (grober Umriss + Rand) bis Zoom 15 ausschneiden
#      (pmtiles extract holt nur die noetigen Teile, ~5,5 GB statt 140 GB;
#      Zoom 15, weil Protomaps Hausnummern erst dort hat)
#   3. in Teile < 2 GB zerlegen (Grenze je Release-Datei bei GitHub)
#   4. Release "karte-JJJJMMTT-z15" mit den Teilen anlegen
#   5. stand.json + style.json im Repo aktualisieren - die App liest
#      stand.json und laedt bei neuem Stand die Teile nach (nur WLAN) und
#      setzt sie auf dem Geraet wieder zu einer Datei zusammen
#   6. alte Releases loeschen (die letzten zwei bleiben)
#
# Der Commit in Schritt 5 haelt den Zeitplan am Leben: GitHub schaltet
# geplante Laeufe in oeffentlichen Repos nach 60 Tagen ohne Aktivitaet ab.
name: Offline-Karte bauen

on:
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch bauen, wenn der Protomaps-Stand schon da ist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: karte
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.31.2"
  BASEMAPS_VERSION: "5.7.2"
  MAXZOOM: "15"
  TEILGROESSE: "1900m"
  GROSS: /mnt/karte

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Neuesten Protomaps-Stand bestimmen
        id: stand
        run: |
          build=$(curl -sf https://build-metadata.protomaps.dev/builds.json | jq -r 'map(select(.key | endswith(".pmtiles"))) | sort_by(.key) | last | .key')
          [ -n "$build" ] || { echo "Kein Protomaps-Stand gefunden"; exit 1; }
          datum=${build%.pmtiles}
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "datum=$datum" >> "$GITHUB_OUTPUT"
          echo "tag=karte-$datum-z$MAXZOOM" >> "$GITHUB_OUTPUT"
          alt=$(jq -r '(.quelle // "") + "-z" + ((.maxzoom // 0) | tostring)' stand.json 2>/dev/null || true)
          if [ "$alt" = "$build-z$MAXZOOM" ] && [ "${{ inputs.erzwingen }}" != "true" ]; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "Stand $build ist schon gebaut."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Werkzeuge
        if: steps.stand.outputs.neu == 'true'
        run: |
          curl -sfL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" | tar xz pmtiles
          pip install --quiet shapely
          npm install --silent --no-save "@protomaps/basemaps@${BASEMAPS_VERSION}"
          # Datei + Teile brauchen ~11 GB - auf / ist zu wenig frei, /mnt ist gross.
          sudo mkdir -p "$GROSS" && sudo chown "$USER" "$GROSS"
          df -h / "$GROSS"

      - name: Deutschland ausschneiden
        if: steps.stand.outputs.neu == 'true'
        run: |
          python3 werkzeug/puffer.py werkzeug/deutschland.geojson gebiet.geojson 0.15
          ./pmtiles extract "https://build.protomaps.com/${{ steps.stand.outputs.build }}" "$GROSS/deutschland.pmtiles" \
            --region=gebiet.geojson --maxzoom="$MAXZOOM" --download-threads=8
          ./pmtiles verify "$GROSS/deutschland.pmtiles"
          ls -l "$GROSS/deutschland.pmtiles"

      - name: Zerlegen und stand.json schreiben
        if: steps.stand.outputs.neu == 'true'
        run: |
          mkdir "$GROSS/teile"
          split -b "$TEILGROESSE" -d -a 2 "$GROSS/deutschland.pmtiles" "$GROSS/teile/deutschland.pmtiles.teil"
          groesse=$(stat -c %s "$GROSS/deutschland.pmtiles")
          sha=$(sha256sum "$GROSS/deutschland.pmtiles" | cut -d' ' -f1)
          rm "$GROSS/deutschland.pmtiles"
          teile=$(for f in "$GROSS"/teile/*; do
            printf '{"name":"%s","groesse":%s,"sha256":"%s"}\n' "$(basename "$f")" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done | jq -s .)
          jq -n --arg tag "${{ steps.stand.outputs.tag }}" --arg quelle "${{ steps.stand.outputs.build }}" \
                --arg datum "${{ steps.stand.outputs.datum }}" --arg gebaut "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --argjson groesse "$groesse" --arg sha "$sha" --argjson maxzoom "$MAXZOOM" --argjson teile "$teile" \
                '{version: 1, tag: $tag, quelle: $quelle, datum: $datum, gebaut: $gebaut, maxzoom: $maxzoom, groesse: $groesse, sha256: $sha, teile: $teile}' \
                > stand.neu.json
          cat stand.neu.json
          node werkzeug/stil.mjs style.json

      - name: Release anlegen
        if: steps.stand.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.stand.outputs.tag }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$GROSS"/teile/* stand.neu.json \
            --title "Offline-Karte Deutschland ${{ steps.stand.outputs.datum }}" \
            --notes "Protomaps-Stand ${{ steps.stand.outputs.build }}, Zoom 0-${MAXZOOM}. Daten © OpenStreetMap-Mitwirkende (ODbL)."

      - name: stand.json und style.json eintragen
        if: steps.stand.outputs.neu == 'true'
        run: |
          mv stand.neu.json stand.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stand.json style.json
          git commit -m "Karte ${{ steps.stand.outputs.datum }}"
          git push

      - name: Alte Releases loeschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            grep '^karte-' | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done || true
