# Baut jede Woche die Offline-Karte aus dem neuesten Protomaps-Stand
# (OpenStreetMap) und stellt sie als Release bereit - je Bundesland eine
# Datei und zusaetzlich ganz Deutschland. Die App laedt nur die Gebiete, die
# der Nutzer auswaehlt.
#
# Ablauf:
#   1. neuesten Tagesstand von build.protomaps.com bestimmen
#   2. Umrisse: werkzeug/gebiete.py macht aus bundeslaender.geojson je Land
#      einen Umriss mit ~5 km Rand plus Deutschland (alle vereinigt)
#   3. jedes Gebiet bis Zoom 15 ausschneiden (Hausnummern hat Protomaps erst
#      dort), in Teile < 2 GB zerlegen (Grenze je Release-Datei bei GitHub)
#   4. Release "karte-JJJJMMTT-z15-l" mit allen Teilen anlegen
#   5. stand.json (Version 2: Liste der Gebiete mit Groesse, SHA-256, Teilen)
#      + style.json im Repo aktualisieren
#   6. alte Releases loeschen (die letzten zwei bleiben)
#
# Der Commit in Schritt 5 haelt den Zeitplan am Leben: GitHub schaltet
# geplante Laeufe in oeffentlichen Repos nach 60 Tagen ohne Aktivitaet ab.
name: Offline-Karte bauen

on:
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch bauen, wenn der Protomaps-Stand schon da ist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: karte
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.31.2"
  BASEMAPS_VERSION: "5.7.2"
  MAXZOOM: "15"
  TEILGROESSE: "1900m"
  GROSS: /mnt/karte
  FORMAT: "l"   # Kennung im Tag: l = je Land (stand.json Version 2)

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Neuesten Protomaps-Stand bestimmen
        id: stand
        run: |
          build=$(curl -sf https://build-metadata.protomaps.dev/builds.json | jq -r 'map(select(.key | endswith(".pmtiles"))) | sort_by(.key) | last | .key')
          [ -n "$build" ] || { echo "Kein Protomaps-Stand gefunden"; exit 1; }
          datum=${build%.pmtiles}
          tag="karte-$datum-z$MAXZOOM-$FORMAT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "datum=$datum" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          alt=$(jq -r '.tag // ""' stand.json 2>/dev/null || true)
          if [ "$alt" = "$tag" ] && [ "${{ inputs.erzwingen }}" != "true" ]; then
            echo "neu=false" >> "$GITHUB_OUTPUT"
            echo "Stand $tag ist schon gebaut."
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Werkzeuge
        if: steps.stand.outputs.neu == 'true'
        run: |
          curl -sfL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" | tar xz pmtiles
          pip install --quiet shapely
          npm install --silent --no-save "@protomaps/basemaps@${BASEMAPS_VERSION}"
          # Alle Teile zusammen ~13 GB - auf / ist zu wenig frei, /mnt ist gross.
          sudo mkdir -p "$GROSS/teile" "$GROSS/meta" && sudo chown -R "$USER" "$GROSS"
          df -h / "$GROSS"

      - name: Gebiete ausschneiden
        if: steps.stand.outputs.neu == 'true'
        run: |
          python3 werkzeug/gebiete.py werkzeug/bundeslaender.geojson gebiete 0.05
          chmod +x werkzeug/gebiet_bauen.sh
          jq -r '.[].id' gebiete/liste.json |
            xargs -P 4 -I{} werkzeug/gebiet_bauen.sh {} "${{ steps.stand.outputs.build }}"
          ls -l "$GROSS/teile"

      - name: stand.json und style.json schreiben
        if: steps.stand.outputs.neu == 'true'
        run: |
          # Liste (Reihenfolge, Namen) mit den Kennzahlen je Gebiet verbinden.
          gebiete=$(jq -s '.' "$GROSS"/meta/*.json |
            jq --slurpfile liste gebiete/liste.json '. as $m | [$liste[0][] | . as $g | ($m[] | select(.id == $g.id)) + {name: $g.name}]')
          jq -n --arg tag "${{ steps.stand.outputs.tag }}" --arg quelle "${{ steps.stand.outputs.build }}" \
                --arg datum "${{ steps.stand.outputs.datum }}" --arg gebaut "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --argjson maxzoom "$MAXZOOM" --argjson gebiete "$gebiete" \
                '{version: 2, tag: $tag, quelle: $quelle, datum: $datum, gebaut: $gebaut, maxzoom: $maxzoom, gebiete: $gebiete}' \
                > stand.neu.json
          jq -r '.gebiete[] | "\(.id) \(.name): \(.groesse / 1000000 | floor) MB, \(.teile | length) Teil(e)"' stand.neu.json
          node werkzeug/stil.mjs style.json

      - name: Release anlegen
        if: steps.stand.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.stand.outputs.tag }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" stand.neu.json \
            --title "Offline-Karte ${{ steps.stand.outputs.datum }} (je Bundesland + Deutschland)" \
            --notes "Protomaps-Stand ${{ steps.stand.outputs.build }}, Zoom 0-${MAXZOOM}. Daten © OpenStreetMap-Mitwirkende (ODbL)."
          # In Gruppen hochladen - ein einzelner Aufruf mit ~25 grossen Dateien bricht eher ab.
          ls "$GROSS"/teile/* | xargs -n 4 gh release upload "$tag" --clobber

      - name: stand.json und style.json eintragen
        if: steps.stand.outputs.neu == 'true'
        run: |
          mv stand.neu.json stand.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stand.json style.json
          git commit -m "Karte ${{ steps.stand.outputs.datum }}"
          git push

      - name: Alte Releases loeschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            grep '^karte-' | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done || true
